<svg width="100%" viewBox="0 0 680 140" role="img" xmlns="http://www.w3.org/2000/svg">
<title>IoTextra Analog overview</title>
<desc>IoTextra Analog — 4-channel differential analog input module overview with key specs</desc>
<rect x="0" y="0" width="680" height="140" rx="10" fill="none" stroke="#e0e0de" stroke-width="0.5"/>
<rect x="0" y="0" width="6" height="140" rx="3" fill="#8f0000"/>
<text x="30" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="500" fill="#111111">IoTextra Analog</text>
<text x="30" y="56" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#444444">4-channel differential analog input module · 16-bit ADC (ADS1115) · up to 860 SPS · I²C only</text>
<text x="30" y="76" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#444444">Voltage: 0–0.5V · 0–5V · 0–10V · ±0.5V · ±5V · ±10V</text>
<text x="30" y="96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#444444">Current: 0–20mA · 4–20mA · ±20mA · 0–40mA</text>
<text x="30" y="116" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#888888">HOST and Qwiic connectors · 47×56 mm · 5 VDC supply · compatible with IoTsmart and IoTbase · Open Hardware</text>
</svg>
